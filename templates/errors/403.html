{% extends "base.html" %}

{% block title %}403 - Forbidden{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center; margin-top: 4rem;">
    <div class="card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🚫</div>
        <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--danger);">403</h1>
        <h2 class="card-title">Access Denied</h2>
        <p style="color: var(--text-secondary); margin: 1rem 0 2rem;">
            You do not have the required permissions or role to view this resource.
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Return Home</a>
    </div>
</div>
{% endblock %}
