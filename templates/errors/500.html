{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="auth-wrapper" style="text-align: center; margin-top: 4rem;">
    <div class="card">
        <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
        <h1 style="font-size: 2.5rem; font-weight: 800; color: var(--warning);">500</h1>
        <h2 class="card-title">Server Error</h2>
        <p style="color: var(--text-secondary); margin: 1rem 0 2rem;">
            An unexpected error occurred while processing your request. Please check the database connection and system logs.
        </p>
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Return Home</a>
    </div>
</div>
{% endblock %}
