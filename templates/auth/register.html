{% extends "base.html" %}

{% block title %}Member Registration - Smart Gym{% endblock %}

{% block content %}
<div class="auth-wrapper wide">
    <div class="card">
        <h2 class="card-title" style="text-align: center;">Member Registration</h2>
        <p class="card-subtitle" style="text-align: center;">Fill out your details to sign up. Registrations are verified by gym administrators.</p>

        <form id="register-form" method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-row">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name *</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Alex Johnson" required>
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address *</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="alex@example.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password" class="form-label">Password * (min 6 chars)</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password *</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1-555-0199">
                </div>
                <div class="form-group">
                    <label for="gender" class="form-label">Gender</label>
                    <select id="gender" name="gender" class="form-control">
                        <option value="">-- Select Gender --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date_of_birth" class="form-label">Date of Birth</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" class="form-control">
                </div>
                <div class="form-group">
                    <label for="emergency_contact" class="form-label">Emergency Contact Phone</label>
                    <input type="tel" id="emergency_contact" name="emergency_contact" class="form-control" placeholder="+1-555-0188">
                </div>
            </div>

            <div class="form-group">
                <label for="address" class="form-label">Residential Address</label>
                <textarea id="address" name="address" rows="2" class="form-control" placeholder="Street address, city..."></textarea>
            </div>

            <button type="submit" class="btn btn-accent btn-block" style="margin-top: 1rem;">
                Submit Registration
            </button>
        </form>

        <div class="auth-footer-text">
            Already registered? <a href="{{ url_for('auth.login') }}">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
