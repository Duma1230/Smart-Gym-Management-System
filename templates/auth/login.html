{% extends "base.html" %}

{% block title %}Sign In - Smart Gym{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <h2 class="card-title" style="text-align: center;">Sign In</h2>
        <p class="card-subtitle" style="text-align: center;">Access your gym portal account</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer-text">
            Don't have an account yet? <a href="{{ url_for('auth.register') }}">Join as a Member</a>
        </div>
    </div>
</div>
{% endblock %}
